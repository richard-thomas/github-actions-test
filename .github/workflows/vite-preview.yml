name: Preview Vite (Build &) Deployment

on:
  # Trigger on creation and subsequent updates of a Pull Request.
  # synchronize: natively handles new commits pushed to an existing PR.
  # reopened: in case a closed PR is brought back to life.
  pull_request:
    types: [opened, synchronize, reopened]

# Explicitly grant write permissions for GitHub Pages and PR Comments
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Build using the reusable workflow
  build-preview:
    uses: ./.github/workflows/reusable-vite-build.yml
    with:
      # Pass a blank forward slash so Vite compiles assets with absolute/relative flexibility
      base_path: './'

  # Job 2: Download the built artifact and deploy it
  deploy-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Download the artifact generated by your reusable workflow
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-dist-artifact
          path: dist

      # Deploy using the rajyan action
      - name: Deploy Preview
        uses: rajyan/preview-pages@v1
        with:
          source-dir: dist
          # Explicitly nesting them inside "preview/" root folder
          target-dir: preview
          pr-per-commit: false
